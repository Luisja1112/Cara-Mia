<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Un pequeño detalle para ti</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;background:#050308;overflow:hidden;font-family:'IM Fell English',Georgia,serif;color:#f4e9d8}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#vig{position:fixed;inset:0;z-index:4;pointer-events:none;background:linear-gradient(to top,#050308ee 0,#05030800 34%),radial-gradient(ellipse at center,transparent 55%,#000c 100%)}
#frame{position:fixed;inset:10px;z-index:5;pointer-events:none;border:2px solid #b8962e;border-radius:3px;box-shadow:inset 0 0 0 7px #050308,inset 0 0 0 8px #b8962e88}
#title{position:fixed;z-index:6;top:5.5vh;left:0;right:0;text-align:center;font:700 clamp(1.3rem,4.2vw,2.8rem) 'Cinzel Decorative',Georgia,serif;color:#e9c96a;text-shadow:0 0 18px #ff7fb066,0 2px 6px #000;opacity:0;transform:translateY(-14px);transition:all 2.4s ease}
#msg{position:fixed;z-index:6;bottom:7vh;left:9vw;right:9vw;text-align:center;font-style:italic;font-size:clamp(1.1rem,2.7vw,1.9rem);line-height:1.45;color:#fbe9f1;text-shadow:0 2px 14px #000,0 0 6px #000;opacity:0;transition:opacity 1.4s}
#title.on,#msg.on{opacity:1;transform:none}
#intro{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:0 8vw;
background:radial-gradient(ellipse at 50% 35%,#2e1028 0,#050308 72%),repeating-linear-gradient(90deg,#ffffff0b 0 1px,transparent 1px 26px);background-blend-mode:normal;transition:opacity 2s ease 0.2s,transform 2.4s ease}
#intro::before{content:"";position:absolute;inset:10px;border:2px solid #b8962e;box-shadow:inset 0 0 0 7px #050308,inset 0 0 0 8px #b8962e88;pointer-events:none}
#intro h2{font-style:italic;font-weight:400;font-size:clamp(1.2rem,3.4vw,2.1rem);color:#f2dfe8;letter-spacing:.04em}
#intro h1{margin:.5em 0 1.2em;font:700 clamp(2.2rem,9vw,5.8rem)/1.05 'Cinzel Decorative',Georgia,serif;background:linear-gradient(100deg,#b8862e 20%,#fff2b8 45%,#ff9ec6 55%,#b8862e 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 0 14px #ff7fb055)}
#intro p{font-size:clamp(.95rem,2vw,1.25rem);color:#cdb7c4;animation:blink 2.4s ease-in-out infinite}
.orn{color:#b8962e;font-size:1.6rem;margin-bottom:.6em}
#spider{position:absolute;top:0;left:14%;width:2px;height:26vh;background:linear-gradient(#ffffff55,#ffffff99);transform-origin:top;animation:sw 4.5s ease-in-out infinite alternate}
#spider::after{content:"🕷️";position:absolute;bottom:-18px;left:-11px;font-size:22px;filter:grayscale(1) brightness(.5) drop-shadow(0 0 3px #fff6)}
#flash{position:fixed;inset:0;z-index:11;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff 0,#ffd0e4 25%,#ff7fb000 70%)}
body.go #intro{opacity:0;transform:scale(1.12);pointer-events:none}
body.go #flash{animation:fl 2.4s ease-out .3s}
@keyframes shine{to{background-position:-250% 0}}
@keyframes blink{50%{opacity:.35}}
@keyframes sw{from{transform:rotate(-5deg) scaleY(.82)}to{transform:rotate(5deg) scaleY(1)}}
@keyframes fl{0%{opacity:0}18%{opacity:.85}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){#intro h1,#intro p,#spider{animation:none}}
</style></head><body>
<canvas id="c"></canvas><div id="vig"></div><div id="frame"></div>
<div id="title">Para ti, tomatito cherry</div><div id="msg"></div>
<div id="intro"><div id="spider"></div>
<div class="orn">✦ ❦ ✦</div>
<h2>Un pequeño detalle para ti,</h2>
<h1>tomatito cherry</h1>
<p>Presiona Enter ↵ &nbsp;(o toca la pantalla)</p></div>
<div id="flash"></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,F=[],P=[],start=Infinity,last=0,started=false;
const clamp=x=>Math.max(0,Math.min(1,x)),R=Math.random,TAU=Math.PI*2;
const eob=x=>{const c=1.5;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const ec=x=>1-Math.pow(1-x,3);

function build(){
  const s=Math.min(W*1.3,H*1.1);
  const defs=[[.5,.36,.21,'p',0],[.27,.46,.15,'w',.5],[.73,.44,.16,'w',.8],[.13,.6,.12,'p',1.2],[.87,.57,.12,'p',1.5],
    [.39,.29,.12,'w',1],[.63,.27,.13,'p',1.3],[.19,.38,.1,'w',1.8],[.81,.34,.1,'w',2.1]];
  F=defs.map(d=>({x:d[0]*W,hy:d[1]*H,r:d[2]*s,type:d[3],delay:d[4],bx:d[0]*W+(R()-.5)*W*.12,
    curve:(R()-.5)*2,ph:R()*TAU,rot:R()*TAU,burst:false,
    spots:Array.from({length:16},()=>[(R()-.5)*1.1,.1+R()*.45,.008+R()*.01])})).sort((a,b)=>a.r-b.r);
}
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);build()}
addEventListener('resize',rs);rs();

/* ---------- fondo ---------- */
function web(x,y,sx,sy,Rr){
  ctx.save();ctx.translate(x,y);ctx.scale(sx,sy);ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1;
  const n=6,pts=a=>[Math.cos(a),Math.sin(a)];
  for(let i=0;i<=n;i++){const a=i/n*Math.PI/2,[c,s]=pts(a);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(c*Rr,s*Rr);ctx.stroke()}
  for(let k=1;k<=5;k++){const r=Rr*k/5;for(let i=0;i<n;i++){const a=i/n*Math.PI/2,b=(i+1)/n*Math.PI/2,m=(a+b)/2;
    ctx.beginPath();ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);ctx.quadraticCurveTo(Math.cos(m)*r*.82,Math.sin(m)*r*.82,Math.cos(b)*r,Math.sin(b)*r);ctx.stroke()}}
  ctx.restore()}
function bat(x,y,s,fl){ctx.beginPath();ctx.moveTo(0,0);
  ctx.save();ctx.translate(x,y);ctx.fillStyle='#000';ctx.beginPath();ctx.moveTo(0,0);
  ctx.quadraticCurveTo(s*.5,-s*.7*fl,s,-s*.15*fl);ctx.quadraticCurveTo(s*.6,s*.1,s*.4,s*.25);ctx.quadraticCurveTo(s*.2,s*.08,0,s*.3);
  ctx.quadraticCurveTo(-s*.2,s*.08,-s*.4,s*.25);ctx.quadraticCurveTo(-s*.6,s*.1,-s,-s*.15*fl);ctx.quadraticCurveTo(-s*.5,-s*.7*fl,0,0);ctx.fill();ctx.restore()}
function bg(t){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#150a1c');g.addColorStop(.6,'#0b0610');g.addColorStop(1,'#050308');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.025)';for(let x=0;x<W;x+=26)ctx.fillRect(x,0,1,H);
  const mx=W*.8,my=H*.2,mr=Math.min(W,H)*.075;
  let mg=ctx.createRadialGradient(mx,my,mr*.5,mx,my,mr*5);mg.addColorStop(0,'rgba(230,215,255,.28)');mg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=mg;ctx.fillRect(mx-mr*5,my-mr*5,mr*10,mr*10);
  ctx.fillStyle='#efe8fb';ctx.beginPath();ctx.arc(mx,my,mr,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(120,100,160,.25)';[[.3,-.2,.25],[-.35,.25,.2],[.1,.4,.15]].forEach(c=>{ctx.beginPath();ctx.arc(mx+c[0]*mr,my+c[1]*mr,c[2]*mr,0,TAU);ctx.fill()});
  for(let i=0;i<3;i++){const sp=.05+i*.02,bx=((t*sp*W*.9+i*W*.37)%(W+200))-100;
    bat(W-bx,H*(.12+i*.07)+Math.sin(t*1.3+i)*14,12+i*5,Math.sin(t*9+i*2));}
  web(14,14,1,1,Math.min(W,H)*.2);web(W-14,14,-1,1,Math.min(W,H)*.2);
}

/* ---------- lirio ---------- */
const stops={p:[[0,'#e6f2a6'],[.14,'#ff6fa8'],[.6,'#ffb3d1'],[1,'#fff1f7']],w:[[0,'#d8ecaa'],[.16,'#fffdfd'],[.7,'#fbf3f8'],[1,'#ffd9e8']]};
function petal(f,L,wid,bend,t){
  ctx.beginPath();ctx.moveTo(0,0);
  ctx.bezierCurveTo(wid*.95,-L*.2,wid*1.2,-L*.68,bend,-L);
  ctx.bezierCurveTo(-wid*1.2,-L*.68,-wid*.95,-L*.2,0,0);
  const g=ctx.createLinearGradient(0,0,0,-L);stops[f.type].forEach(s=>g.addColorStop(s[0],s[1]));
  ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=f.type=='p'?'rgba(255,255,255,.35)':'rgba(255,170,205,.45)';ctx.lineWidth=1;ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-L*.04);ctx.quadraticCurveTo(bend*.3,-L*.5,bend*.8,-L*.88);
  ctx.strokeStyle=f.type=='p'?'rgba(255,255,255,.55)':'rgba(226,100,150,.35)';ctx.lineWidth=Math.max(1,L*.012);ctx.stroke();
  ctx.fillStyle=f.type=='p'?'rgba(150,20,80,.75)':'rgba(205,80,130,.55)';
  for(const s of f.spots){ctx.beginPath();ctx.arc(s[0]*wid*.7,-s[1]*L,s[2]*L,0,TAU);ctx.fill()}
}
function lily(f,x,y,b,t){
  const r=f.r;ctx.save();ctx.translate(x,y);ctx.rotate(f.rot*.15+Math.sin(t*.5+f.ph)*.05);ctx.scale(1,.8);
  if(b>.15){const g=ctx.createRadialGradient(0,0,0,0,0,r*1.7);
    g.addColorStop(0,f.type=='p'?`rgba(255,110,170,${.3*b})`:`rgba(255,235,248,${.28*b})`);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(-r*1.8,-r*1.8,r*3.6,r*3.6)}
  for(const i of [0,2,4,1,3,5]){
    const outer=i%2==0,open=eob(clamp(b*1.25-(outer?0:.12)));
    const L=r*(outer?1:.93)*(.28+.72*open),wid=L*(.3+.2*open)*(outer?1:1.12);
    let a=i*Math.PI/3;if(a>Math.PI)a-=TAU;a*=.12+.88*clamp(open);
    ctx.save();ctx.rotate(a);petal(f,L,wid,open*L*.1*Math.sin(t*.9+i+f.ph),t);ctx.restore()}
  if(b>.35){const sb=ec(clamp((b-.35)/.6));
    ctx.lineCap='round';
    for(let j=0;j<6;j++){const a=j*Math.PI/3+.5,len=r*.55*sb,ex=Math.sin(a)*len,ey=-Math.cos(a)*len;
      ctx.strokeStyle='#f6f1cf';ctx.lineWidth=Math.max(1.5,r*.014);ctx.beginPath();ctx.moveTo(0,0);
      ctx.quadraticCurveTo(ex*.45+ey*.12,ey*.45-ex*.12,ex,ey);ctx.stroke();
      ctx.save();ctx.translate(ex,ey);ctx.rotate(a+Math.sin(t*1.2+j)*.15+1.3);
      ctx.fillStyle='#74290f';ctx.beginPath();ctx.ellipse(0,0,r*.07,r*.024,0,0,TAU);ctx.fill();
      ctx.fillStyle='#e0852f';ctx.beginPath();ctx.ellipse(-r*.01,-r*.006,r*.04,r*.01,0,0,TAU);ctx.fill();ctx.restore()}
    const pa=-.35,pl=r*.72*sb,px=Math.sin(pa)*pl,py=-Math.cos(pa)*pl;
    ctx.strokeStyle='#eaf3b8';ctx.lineWidth=Math.max(2,r*.02);ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(px*.3,py*.5,px,py);ctx.stroke();
    ctx.fillStyle='#d9ff8a';for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(px+Math.cos(k*2.1)*r*.025,py+Math.sin(k*2.1)*r*.025,r*.024,0,TAU);ctx.fill()}}
  ctx.restore()}

function stemPt(f,u,sw){
  const x0=f.bx,y0=H+30,x1=f.x+sw,y1=f.hy,cx=(x0+x1)/2+f.curve*f.r*.9,cy=(y0+y1)/2,v=1-u;
  return [v*v*x0+2*v*u*cx+u*u*x1,v*v*y0+2*v*u*cy+u*u*y1]}
function leaf(x,y,ang,L){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(0,0);
  ctx.quadraticCurveTo(L*.45,-L*.16,L,0);ctx.quadraticCurveTo(L*.45,L*.1,0,0);
  const g=ctx.createLinearGradient(0,0,L,0);g.addColorStop(0,'#17301f');g.addColorStop(1,'#3d7a4c');ctx.fillStyle=g;ctx.fill();ctx.restore()}

/* ---------- partículas ---------- */
function spawn(o){P.push(Object.assign({x:0,y:0,vx:0,vy:0,life:0,max:4,k:'s',s:4,rot:R()*TAU,vr:(R()-.5)*3,c:'#ffd77a',ph:R()*TAU},o))}
function burst(f,x,y){for(let i=0;i<34;i++){const a=R()*TAU,v=60+R()*220;
  spawn({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,max:2.5+R()*2.5,k:i%3?'s':'p',s:2+R()*5,c:i%3?'#ffe9a0':(i%2?'#ffb3d1':'#fff')})}}
function drawStar(x,y,s){ctx.beginPath();ctx.moveTo(x,y-s);ctx.quadraticCurveTo(x,y,x+s,y);ctx.quadraticCurveTo(x,y,x,y+s);ctx.quadraticCurveTo(x,y,x-s,y);ctx.quadraticCurveTo(x,y,x,y-s);ctx.fill()}

/* ---------- bucle ---------- */
function frame(now){
  const t=(now-start)/1000,dt=Math.min(.05,(now-last)/1000);last=now;const T=now/1000;
  bg(T);
  for(const f of F){
    const tt=t-f.delay;if(tt<0)continue;
    const g=ec(clamp(tt/2.3)),b=clamp((tt-1.9)/3.6),sw=Math.sin(T*.8+f.ph)*f.r*.1*g;
    ctx.lineCap='round';ctx.lineWidth=Math.max(3,f.r*.07);
    const sg=ctx.createLinearGradient(0,H,0,f.hy);sg.addColorStop(0,'#16301f');sg.addColorStop(1,'#3f8250');ctx.strokeStyle=sg;
    ctx.beginPath();for(let u=0;u<=g+.001;u+=.03){const p=stemPt(f,Math.min(u,g),sw);u?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}ctx.stroke();
    [.28,.46,.62,.78].forEach((k,i)=>{if(g>k){const p=stemPt(f,k,sw),q=stemPt(f,k+.02,sw),ta=Math.atan2(q[1]-p[1],q[0]-p[0]);
      const sd=i%2?1:-1,L=Math.min(1,(g-k)*3.5)*f.r*(1.15-i*.1);leaf(p[0],p[1],ta+sd*(.95+Math.sin(T+i)*.06),L)}});
    if(g>.85){const hp=stemPt(f,g,sw);lily(f,hp[0],hp[1],b,T);
      if(b>=.98&&!f.burst){f.burst=true;burst(f,hp[0],hp[1])}}
  }
  if(t>2.5){ if(R()<dt*7)spawn({x:R()*W,y:-20,vx:(R()-.5)*30,vy:35+R()*45,max:16,k:'p',s:5+R()*6,c:R()<.6?'#ffb3d1':'#fff'});
    if(R()<dt*14)spawn({x:R()*W,y:H*(.4+R()*.6),vx:(R()-.5)*14,vy:-12-R()*22,max:5+R()*4,k:'s',s:1.5+R()*3})}
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.life+=dt;if(p.life>p.max){P.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    if(p.k=='p'){p.vy+=60*dt*(p.life<2?1:.15);p.vx*=.985;p.vx+=Math.sin(T*1.5+p.ph)*.9}else{p.vy*=.985;p.vx*=.985}
    const al=Math.sin(Math.PI*p.life/p.max)*(p.k=='s'?.5+.5*Math.sin(T*6+p.ph):1);ctx.globalAlpha=Math.max(0,al);ctx.fillStyle=p.c;
    if(p.k=='s')drawStar(p.x,p.y,p.s);else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,.35+.65*Math.abs(Math.sin(T*2+p.ph)));
      ctx.beginPath();ctx.ellipse(0,0,p.s,p.s*.5,0,0,TAU);ctx.fill();ctx.restore()}
    ctx.globalAlpha=1}
  const mg=ctx.createLinearGradient(0,H*.75,0,H);mg.addColorStop(0,'rgba(120,60,130,0)');mg.addColorStop(1,`rgba(120,60,130,${.2+.08*Math.sin(T*.7)})`);
  ctx.fillStyle=mg;ctx.fillRect(0,H*.75,W,H*.25);
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);

/* ---------- mensajes ---------- */
const lines=[
 "Como Homero le dice a Morticia: «Cara mía, eres mi flor favorita».",
 "Hasta en la noche más oscura, tú floreces.",
 "Gracias por ser ternura, luz y un poquito de magia en mis días.",
 "Eres especial, eres valiosa, y mereces todas las flores del mundo.",
 "Nunca lo olvides, mi tomatito cherry 🍅💗"];
const msg=document.getElementById('msg');
function show(l){msg.classList.remove('on');setTimeout(()=>{msg.textContent=l;msg.classList.add('on')},900)}
function go(){
  if(started)return;started=true;document.body.classList.add('go');
  start=performance.now()+800;
  setTimeout(()=>document.getElementById('title').classList.add('on'),6200);
  lines.forEach((l,i)=>setTimeout(()=>show(l),8000+i*5200));
}
addEventListener('keydown',e=>{if(e.key==='Enter')go()});
document.getElementById('intro').addEventListener('click',go);
</script></body></html>
